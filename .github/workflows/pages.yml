
name: Frontend and API Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify Vercel layout
        run: npm run verify:vercel

      - name: Run API unit tests
        run: node api/_lib/tests.js

      - name: Check API syntax
        shell: bash
        run: |
          for file in api/_lib/*.js api/*.js api/admin/*.js api/admin/auth/*.js; do
            node --check "$file"
          done

      - name: Audit production dependencies
        run: npm audit --omit=dev
