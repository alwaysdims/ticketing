name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run verify:vercel
      - run: node api/_lib/tests.js
      - name: Check API syntax
        shell: bash
        run: |
          for file in api/_lib/*.js api/*.js api/admin/*.js api/admin/auth/*.js; do
            node --check "$file"
          done
      - run: npm audit --omit=dev
